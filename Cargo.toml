[package]
name = "datatoad"
version = "0.1.0"
edition = "2024"

[dependencies]
columnar = "0.12"
getopts = { version = "0.2.24" }
regex = "1.11.1"
mimalloc = { version = "0.1.48", features = ["v3"], optional = true }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"], optional = true }
simd-csv = "0.10.3"
timely_bytes = { version = "0.30" }
timely_communication = { version = "0.30" }

# forge-sort is a GPU/Metal radix sort (Apple Silicon only); used solely by the
# radix_bakeoff example to compare against our CPU kernels. Optional and off by
# default because its build.rs AOT-compiles a .metal shader via `xcrun metal`,
# which needs a full Xcode install (the Command Line Tools alone lack `metal`).
# Enable with `--features forge` once Xcode is present.
[target.'cfg(target_os = "macos")'.dependencies]
forge-sort = { version = "0.2", optional = true }
# The `metal` crate compiles our shader at runtime via the Metal driver (no Xcode,
# unlike forge-sort). Backs the GPU radix kernels in `radix_sort_metal`.
metal = { version = "0.29", optional = true }

[profile.release]
# One codegen unit, so that inlining is deterministic across builds. The default (16)
# partitions the crate by size estimate, and a one-line source change can reshuffle
# which functions share a unit, silently swinging hot-path inlining and benchmarks by
# 10-25%. A single unit also measured faster than the default (fewer cycles, despite
# more instructions retired), and compile time is not a constraint here.
codegen-units = 1

[features]
# mimalloc is the CLI allocator and backs the `.heap` directive's stats. It is C, so
# cross-compiling it to wasm needs a wasi-sdk (clang + sysroot) we don't carry — not
# worth it for a demo that has no `.heap` and where the stock wasm allocator is fine.
# On by default so the CLI binary is unchanged; the wasm web crate builds with
# `default-features = false` to drop it.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Adds the forge-sort GPU contender to the radix_bakeoff example (needs Xcode).
forge = ["dep:forge-sort"]
# Our own runtime-compiled Metal GPU radix kernels (no Xcode needed).
metal = ["dep:metal"]
